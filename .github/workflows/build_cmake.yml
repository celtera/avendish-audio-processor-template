name: CMake build

on: push

# Self-contained CI: every dependency is fetched here (no external prebuilt SDK image),
# mirroring the avendish video / geometry templates. avnd_make_all emits, for the single
# MyProcessor object, every back-end whose SDK is available:
#
#   * CLAP / VST3 / "vintage" (VST2-like)  -> audio plug-ins
#   * Max/MSP (Jitter)                      -> a Max external
#   * TouchDesigner CHOP                    -> a Custom Operator
#   * Godot                                 -> a GDExtension (Node + AudioEffect)
#   * GStreamer                             -> an audio element
#   * Pd                                    -> a Pure Data external
#   * Python                                -> an importable extension module
#   * standalone / example host             -> test programs
#   * ossia score                           -> needs libossia; not exercised here
#
# SDKs fetched per run:
#   - CLAP   : https://github.com/free-audio/clap   (headers; via CMAKE_PREFIX_PATH)
#   - VST3   : https://github.com/steinbergmedia/vst3sdk (built lean: no VSTGUI/examples)
#   - Max    : https://github.com/jcelerier/max-sdk-base
#   - TD     : https://github.com/jcelerier/CustomOperatorSamples
#   - godot-cpp is fetched automatically by CMake.
#   - GStreamer dev packages are installed best-effort on Linux only.
#
# Toolchain (cf. the avendish reference CI): Avendish's C++23 reflection needs a recent
# compiler, so Linux uses clang-20 from apt.llvm.org, macOS uses Xcode 26, and Windows
# uses clang-cl (also required by the TouchDesigner SDK's MSVC ABI). Boost >= 1.87 is
# downloaded (Ubuntu's system Boost is too old) and passed via BOOST_ROOT.

env:
  BOOST_URL: "https://github.com/ossia/score-sdk/releases/download/sdk31/boost_1_90_0.tar.gz"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Linux",
              os: ubuntu-24.04,
              triple: "linux-clang-x86_64",
              dependencies: "sudo apt update ; \
                             curl -L https://apt.llvm.org/llvm.sh > llvm.sh ; \
                             chmod +x ./llvm.sh ; \
                             sudo ./llvm.sh 20 ; \
                             sudo apt install -y ninja-build clang-20 lld-20 ; \
                             sudo apt install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev libjson-glib-dev libsoup2.4-dev || true",
              common_flags: "-DCMAKE_C_COMPILER=clang-20 \
                             -DCMAKE_CXX_COMPILER=clang++-20 \
                             -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld-20 \
                             -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld-20 \
                             -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld-20"
            }
          - {
              # clang-cl (not cl): MSVC ABI (required by the TouchDesigner SDK) with the
              # Clang front-end. Plain MSVC emits an external reference for Avendish's
              # `extern const fake_object_for_indices` (used only in constexpr), which
              # then fails to link; Clang correctly elides it, like on Linux/macOS.
              name: "Windows",
              os: windows-latest,
              triple: "windows-clang-x86_64",
              dependencies: "choco install -y ninja llvm",
              common_flags: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl"
            }
          - {
              name: "macOS",
              os: macos-26,
              triple: "macos-clang-aarch64",
              dependencies: "brew install ninja",
              common_flags: ""
            }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CLAP SDK (headers only). avnd_make_clap finds it via find_path(clap/clap.h), so
      # the checkout's include/ directory is put on CMAKE_PREFIX_PATH below.
      - name: Checkout CLAP SDK
        uses: actions/checkout@v4
        with:
          repository: free-audio/clap
          path: clap-sdk

      # VST3 SDK. avnd_make_vst3 add_subdirectory()s it; built lean (no VSTGUI / no
      # samples) so it needs no GUI system libraries.
      - name: Checkout VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          submodules: "recursive"
          path: vst3sdk

      # TouchDesigner Custom Operator SDK headers (CHOP), consumed via include/.
      - name: Checkout TouchDesigner SDK headers
        uses: actions/checkout@v4
        with:
          repository: jcelerier/CustomOperatorSamples
          ref: add-pop-headers
          path: touchdesigner-sdk

      # Max SDK headers (jit/max/msp), consumed via AVND_MAXSDK_PATH.
      - name: Checkout Max SDK
        uses: actions/checkout@v4
        with:
          repository: jcelerier/max-sdk-base
          submodules: "recursive"
          path: max-sdk-base

      - name: Select Xcode 26 (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # The TouchDesigner SDK requires the MSVC ABI; set up the MSVC environment.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # A consistent Python with development headers on every platform for avnd_make_python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pybind11
        shell: bash
        run: python -m pip install --upgrade pip pybind11

      - name: Install dependencies
        shell: bash
        run: |
          ${{ matrix.config.dependencies }}

      - name: Set up Boost
        shell: bash
        run: |
          curl -fsSL "$BOOST_URL" -o boost.tar.gz
          mkdir -p boost/include
          tar -xzf boost.tar.gz --strip-components=1 --directory boost/include

      - name: Build release
        shell: bash
        run: |
          export BUILD_DIR=build-release
          export INSTALL_DIR="$PWD/install"
          mkdir -p "$INSTALL_DIR"
          export VERBOSE=1

          cmake -S "$PWD" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=1 \
            -DTOUCHDESIGNER_SDK_PATH="$PWD/touchdesigner-sdk" \
            -DAVND_MAXSDK_PATH="$PWD/max-sdk-base" \
            -DVST3_SDK_ROOT="$PWD/vst3sdk" \
            -DCMAKE_PREFIX_PATH="$PWD/clap-sdk" \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" \
            -DBOOST_ROOT="$PWD/boost" \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ADD_VSTGUI=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF \
            -DSMTG_RUN_VST_VALIDATOR=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            ${{ matrix.config.common_flags }}

          # Build everything: all back-ends whose SDK was provided above, for the single
          # object, with no per-platform target list to maintain.
          cmake --build "$BUILD_DIR"

          echo " === build tree === "
          ls -R "$BUILD_DIR"/clap "$BUILD_DIR"/vst3 "$BUILD_DIR"/vintage "$BUILD_DIR"/max "$BUILD_DIR"/td "$BUILD_DIR"/godot "$BUILD_DIR"/pd "$BUILD_DIR"/python "$BUILD_DIR"/standalone "$BUILD_DIR"/gstreamer 2>/dev/null || true

          shopt -s nullglob
          for backend in clap vst3 vintage max td godot pd python standalone example gstreamer; do
            [ -d "$BUILD_DIR/$backend" ] || continue
            (
              cd "$BUILD_DIR/$backend"
              # -e (not -f): VST3 / macOS-Max / etc. are *bundles* (directories), which
              # cmake -E tar archives recursively; a -f test would silently drop them.
              for file in *; do
                [ -e "$file" ] || continue
                cmake -E tar cf "$INSTALL_DIR/$backend-${{ matrix.config.triple }}-$file.zip" --format=zip -- "$file"
              done
            )
          done

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.triple }}
          path: |
            install/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Combine
        shell: bash
        run: |
          find . -name '*.zip'
          mkdir -p output
          find . -name '*.zip' -exec mv {} output/ \;

      - name: Upload
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "output/*"
          branches: "main"
          verbose: true
          prerelease: true
          tag_name: "continuous"
          default_release_name: "Continuous build"
